name: Continuous Integration & Quality Gates

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  NX_IGNORE_UNSUPPORTED_TS_SETUP: 'true'

jobs:
  quality-gates:
    name: Lint, Test & Accessibility Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck Nx Plugin Package
        run: npx nx run-many -t build

      - name: Run Unit & A11y Tests (Jest + jest-axe)
        run: npx nx run-many -t test --coverage

      - name: Build Applications
        run: npx nx run-many -t build --prod

      - name: Store Code Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage
          path: coverage/