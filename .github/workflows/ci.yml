name: Continuous Integration & Quality Gates

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality-gates:
    name: Lint, Test & Accessibility Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck Workspace
        run: npx tsc --noEmit

      - name: Run Unit & A11y Tests (Jest + jest-axe)
        env:
          NX_IGNORE_UNSUPPORTED_TS_SETUP: true
        run: npx nx run-many -t test --coverage

      - name: Build Applications
        env:
          NX_IGNORE_UNSUPPORTED_TS_SETUP: true
        run: npx nx run-many -t build --prod

      - name: Store Code Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage
          path: coverage/